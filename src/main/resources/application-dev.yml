server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
    include-stacktrace: ON_PARAM

spring:
  datasource:
    url: jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com/resto_saas?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: 3MdsdoN6bsGXtLk.root
    password: Tpriv1rYoawJpAgl
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: resto-pool
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: false
    locations: classpath:db/migration
    validate-on-migrate: true
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  jackson:
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  lifecycle:
    timeout-per-shutdown-phase: 20s

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    mail:
      enabled: false

app:
  security:
    jwt:
      secret: ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi1jaGFuZ2UtbWUtcGxlYXNlLTEyMzQ1Njc4OTA=
      access-ttl-seconds: 900
      refresh-ttl-days: 30
      issuer: resto-saas
    cors:
      allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175
      allow-credentials: true
  payments:
    provider: sandbox
    stripe:
      api-key: ""
      webhook-secret: ""
  storage:
    provider: cloudinary
    tidb-fs:
      base-path: ${TIDB_FS_MOUNT_PATH:${user.home}/tidbcloudfs}
    public-base-url: http://localhost:8080/api/v1/storage
  seed:
    enabled: true
    admin-email: admin@resto-saas.local
    admin-password: Admin123!
  frontend:
    admin-base-url: http://localhost:5173
    customer-base-url: http://localhost:5175

logging:
  level:
    root: INFO
    com.restaurant.saas: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: INFO
