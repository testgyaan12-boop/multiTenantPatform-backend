server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: resto-saas
  profiles:
    active: ${APP_ENV:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:resto_saas}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:resto}
    password: ${DB_PASSWORD:resto_dev_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      connection-timeout: 10000
      pool-name: resto-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  jackson:
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  lifecycle:
    timeout-per-shutdown-phase: 20s

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi1jaGFuZ2UtbWUtcGxlYXNlLTEyMzQ1Njc4OTA=}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
      refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
      issuer: ${JWT_ISSUER:resto-saas}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
      allow-credentials: true
  payments:
    provider: ${PAYMENT_PROVIDER:sandbox}
    stripe:
      api-key: ${STRIPE_API_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:resto-saas}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/resto-saas}
    local-dir: ${STORAGE_LOCAL_DIR:uploads}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
    admin-email: ${SEED_ADMIN_EMAIL:admin@resto-saas.local}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin123!}
  frontend:
    admin-base-url: ${ADMIN_BASE_URL:http://localhost:5173}
    customer-base-url: ${APP_BASE_URL:http://localhost:5175}

logging:
  level:
    root: INFO
    com.restaurant.saas: INFO
    org.hibernate.SQL: WARN
