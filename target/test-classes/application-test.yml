spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_TEST_NAME:resto_saas_test}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:resto}
    password: ${DB_PASSWORD:resto_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    clean-disabled: false
app:
  seed:
    enabled: false
  payments:
    provider: sandbox
logging:
  level:
    com.restaurant.saas: INFO
